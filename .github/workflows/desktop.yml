name: Windows desktop test build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run test:desktop
        working-directory: source
      - run: node --test tools/settings.test.mjs
        working-directory: source
      - run: npm run smoke
        working-directory: source
      - run: npm run build:exe
        working-directory: source
      - uses: actions/upload-artifact@v4
        with:
          name: SoloTRPG-Windows-x64
          path: source/dist/SoloTRPG-*-Windows-x64.exe
