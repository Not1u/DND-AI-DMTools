name: Windows desktop test build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: node --test tools/settings.test.mjs
      - run: npm run smoke
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: SoloTRPG-Windows-x64
          path: dist/SoloTRPG-*-Windows-x64.exe
